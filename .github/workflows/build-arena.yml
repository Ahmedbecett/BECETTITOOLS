name: Build (Arena vercel/pipeline)

on:
  workflow_dispatch:
  push:
    branches: ["arena/2bcd79c2-becettitools"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
          cache-disabled: true

      - name: Install Android SDK
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/ct
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv /tmp/ct/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Compile (debug variant, fast feedback)
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee /tmp/compile.log

      - name: Build signed Release APK + AAB
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/release.log
          ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      - name: Report sizes
        if: success()
        run: |
          stat -c '%n %s bytes' app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: becetti-build
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            /tmp/compile.log
            /tmp/release.log
          if-no-files-found: ignore

      - name: Print errors on failure
        if: failure()
        run: |
          echo "=== COMPILE ERRORS ==="
          grep -n "^e: " /tmp/compile.log | head -150 || true
          echo "=== RELEASE ERRORS ==="
          grep -n "^e: \|FAILURE:\|What went wrong" -A3 /tmp/release.log | head -150 || true
