name: Build BECETTI TOOLS APK (versioned artifacts only)

# ─────────────────────────────────────────────────────────────────────────────
# FROZEN BASELINE RULE
# BECETTI-TOOLS-v1.0.0-NATIVE-debug.apk is the approved, published v1.0.0 build.
# Its SHA-256 is 460235a24055c4c808ad16b80e3f1cbe38fe81410b57cfb8779d552020a22632.
# This workflow must never rebuild it in place, overwrite it, or commit anything
# back into the repository:
#   • no `push: branches:` trigger — a push to `main` builds nothing at all;
#   • build output is copied to a versioned filename under dist/, never to the
#     repository root;
#   • no git-auto-commit / git push step exists in this workflow;
#   • the frozen file's checksum is verified before and after every build.
# Future APKs are produced as versioned workflow artifacts (and, for tags, as
# release assets that are never uploaded with --clobber).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        options: [debug, release]
        default: debug
      publish_release:
        description: "Attach to the GitHub release for this ref (tag refs only, never overwrites)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FROZEN_APK: BECETTI-TOOLS-v1.0.0-NATIVE-debug.apk
  FROZEN_SHA_FILE: BECETTI-TOOLS-v1.0.0-NATIVE-debug.apk.sha256
  FROZEN_SHA256: 460235a24055c4c808ad16b80e3f1cbe38fe81410b57cfb8779d552020a22632
  VARIANT: ${{ inputs.variant || 'debug' }}

jobs:
  guard:
    name: Guard frozen artifact + resolve version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      is_frozen_baseline: ${{ steps.version.outputs.is_frozen_baseline }}
      artifact_base: ${{ steps.version.outputs.artifact_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify the frozen v1.0.0 APK is intact
        run: |
          set -euo pipefail
          if [ ! -f "$FROZEN_APK" ]; then
            echo "::error file=$FROZEN_APK::Frozen v1.0.0 APK is missing from the repository."
            exit 1
          fi
          actual=$(sha256sum "$FROZEN_APK" | awk '{print $1}')
          echo "Frozen APK  : $FROZEN_APK"
          echo "Size        : $(stat -c%s "$FROZEN_APK") bytes"
          echo "SHA-256     : $actual"
          if [ "$actual" != "$FROZEN_SHA256" ]; then
            echo "::error file=$FROZEN_APK::Frozen APK checksum mismatch. Expected $FROZEN_SHA256, got $actual. Do not proceed — the preserved v1.0.0 baseline must not be modified."
            exit 1
          fi
          # The committed .sha256 file must agree as well.
          sha256sum -c "$FROZEN_SHA_FILE"
          echo "✅ Frozen v1.0.0 baseline verified."

      - name: Resolve version and build a versioned artifact name
        id: version
        run: |
          set -euo pipefail
          gradle_file="app/build.gradle.kts"
          version_name=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' "$gradle_file" | head -1)
          version_code=$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' "$gradle_file" | head -1)
          if [ -z "${version_name:-}" ] || [ -z "${version_code:-}" ]; then
            echo "::error file=$gradle_file::Could not read versionName/versionCode."
            exit 1
          fi

          short_sha=$(git rev-parse --short=7 HEAD)
          artifact_base="BECETTI-TOOLS-v${version_name}-${VARIANT}-${short_sha}"

          # Hard stop: never allow a build to reuse the frozen published filename.
          if [ "$artifact_base" = "$FROZEN_APK" ] || [ "$artifact_base.apk" = "$FROZEN_APK" ]; then
            echo "::error::Computed artifact name collides with the frozen v1.0.0 filename. Refusing to build."
            exit 1
          fi

          is_frozen_baseline="false"
          if [ "$version_name" = "1.0.0" ]; then
            is_frozen_baseline="true"
            echo "::warning::versionName is 1.0.0 — this build is for CI/source validation only. It will NOT be published as a release asset and does NOT replace the preserved artifact. Bump versionName/versionCode in a reviewed PR to produce a new release build."
          fi

          echo "Version name : $version_name"
          echo "Version code : $version_code"
          echo "Variant      : $VARIANT"
          echo "Artifact     : ${artifact_base}.apk"
          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "is_frozen_baseline=$is_frozen_baseline"
            echo "artifact_base=$artifact_base"
          } >> "$GITHUB_OUTPUT"

      - name: Record workflow contract in the job summary
        run: |
          {
            echo "## BECETTI TOOLS — APK build"
            echo ""
            echo "- Frozen artifact verified: \`$FROZEN_APK\` (SHA-256 \`$FROZEN_SHA256\`)"
            echo "- This workflow never commits to the repository."
            echo "- Artifacts are versioned; the v1.0.0 file is never overwritten."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ inputs.variant || 'debug' }})
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
          cache-disabled: true

      - name: Install Android SDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv /tmp/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
          if [ -d "/tmp/cmdline-tools/cmdline-tools" ]; then mv /tmp/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true; fi
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Verify the app is still native (no WebView)
        run: |
          if grep -R "WebView" app/src --include="*.kt" --include="*.xml"; then
            echo "::error::WebView found — this project is meant to stay native."
            exit 1
          fi
          echo "Native verified (no WebView)."

      - name: Assemble ${{ inputs.variant || 'debug' }} APK
        run: |
          set -o pipefail
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          variant="$VARIANT"
          task="assemble$(echo "${variant^}")"
          echo "Running: gradle $task"
          gradle "$task" --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Stage a versioned artifact
        run: |
          set -euo pipefail
          variant="$VARIANT"
          # A release build without a signing config produces app-release-unsigned.apk,
          # so pick whichever APK AGP emitted and keep the "unsigned" hint in the name.
          src=$(ls app/build/outputs/apk/${variant}/*.apk 2>/dev/null | head -1 || true)
          if [ -z "${src:-}" ] || [ ! -f "$src" ]; then
            echo "::error::No APK produced for variant '$variant'."
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          mkdir -p dist
          artifact_base="${{ needs.guard.outputs.artifact_base }}"
          case "$(basename "$src")" in
            *unsigned*) artifact_base="${artifact_base}-unsigned" ;;
          esac
          out="dist/${artifact_base}.apk"

          # Belt and braces: the output filename must never equal the frozen name,
          # and must not be written into the repository root.
          if [ "$(basename "$out")" = "$FROZEN_APK" ]; then
            echo "::error::Refusing to write the frozen v1.0.0 filename."
            exit 1
          fi

          cp "$src" "$out"
          sha256sum "$out" | sed "s#  dist/#  #" > "dist/${artifact_base}.apk.sha256"

          echo "### Built artifact" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "dist/${artifact_base}.apk.sha256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/

      - name: Confirm the frozen v1.0.0 APK was not touched by the build
        if: always()
        run: |
          set -euo pipefail
          actual=$(sha256sum "$FROZEN_APK" | awk '{print $1}')
          git status --porcelain -- "$FROZEN_APK" "$FROZEN_SHA_FILE" || true
          if [ "$actual" != "$FROZEN_SHA256" ]; then
            echo "::error::The frozen v1.0.0 APK changed during this build ($actual). Investigate before doing anything else."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- "$FROZEN_APK")" ]; then
            echo "::error::The frozen v1.0.0 APK is modified in the worktree."
            exit 1
          fi
          echo "✅ Frozen v1.0.0 APK unchanged (SHA-256 $actual)."

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.guard.outputs.artifact_base }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.guard.outputs.artifact_base }}-build-log
          path: /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Attach to release (tag refs only, no overwrite)
    needs: [guard, build]
    if: |
      needs.guard.outputs.is_frozen_baseline == 'false' &&
      (github.ref_type == 'tag' || inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.guard.outputs.artifact_base }}
          path: dist

      - name: Attach to the existing release without replacing anything
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::notice::Not a tag ref — no release to attach to. Download the APK from the workflow run artifacts instead."
            exit 0
          fi
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::No GitHub release exists for tag $TAG. Create the release first, then re-run this workflow — nothing is auto-published."
            exit 0
          fi
          existing=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' || true)
          for asset in dist/*.apk dist/*.apk.sha256; do
            [ -e "$asset" ] || continue
            name=$(basename "$asset")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "::notice::Asset $name already exists on release $TAG — leaving it untouched (no --clobber)."
              continue
            fi
            gh release upload "$TAG" "$asset" --repo "$REPO"
            echo "Attached $name to $TAG"
          done
