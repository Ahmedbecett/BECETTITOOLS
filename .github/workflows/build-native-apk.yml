name: Build BECETTI TOOLS Native APK

on:
  push:
    branches: ["arena/354c3e44-becettitools", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
      - name: Install Android SDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv /tmp/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
          mkdir -p $ANDROID_HOME/cmdline-tools/latest 2>/dev/null || true
          if [ -d "/tmp/cmdline-tools/cmdline-tools" ]; then mv /tmp/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true; fi
          ls $ANDROID_HOME/cmdline-tools/latest/bin/
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          ls -lh $ANDROID_HOME/platforms/ || true
      - name: Build Debug APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          set +e
          gradle assembleDebug --stacktrace > /tmp/gradle.log 2>&1
          cat /tmp/gradle.log
          echo "exit:$?" > /tmp/exitcode
          ls -lh app/build/outputs/apk/debug/ || true
          cat /tmp/exitcode
          exit $(cat /tmp/exitcode | sed 's/exit://')
      - name: Verify native no WebView
        if: success()
        run: |
          if grep -R "WebView" app/src --include="*.kt" --include="*.xml"; then echo "WebView found"; exit 1; fi
          echo "Native 100% Kotlin+Compose verified ✓"
          ls -lh app/build/outputs/apk/debug/
          echo "Size check:"
          stat -c%s app/build/outputs/apk/debug/app-debug.apk || true
      - name: Commit APK to repo
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./BECETTI-TOOLS-v1.0.0-NATIVE-debug.apk
          sha256sum ./BECETTI-TOOLS-v1.0.0-NATIVE-debug.apk > ./BECETTI-TOOLS-v1.0.0-NATIVE-debug.apk.sha256
          ls -lh ./BECETTI-TOOLS*.apk*
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BECETTI-TOOLS-v1.0.0-NATIVE-debug.apk BECETTI-TOOLS-v1.0.0-NATIVE-debug.apk.sha256
          git commit -m "ci: native APK v1.0.0 built (real SDK, no WebView, Kotlin/Compose) [skip ci]" || echo "no changes"
          git push origin HEAD:arena/354c3e44-becettitools || true
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: /tmp/gradle.log
          retention-days: 7
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BECETTI-TOOLS-v1.0.0-debug-native
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

