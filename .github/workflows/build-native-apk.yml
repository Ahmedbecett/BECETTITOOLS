name: Build BECETTI TOOLS Candidate APK

on:
  push:
    branches: ["arena/ba5cdcee-becettitools", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Install Android SDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv /tmp/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
          if [ -d "/tmp/cmdline-tools/cmdline-tools" ]; then mv /tmp/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true; fi
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Ensure Release Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/becetti-release.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/becetti-release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias becetti \
              -storepass "BecettiTools2026!" \
              -keypass "BecettiTools2026!" \
              -dname "CN=Becetti Tools, OU=Mobile Development, O=Becetti, L=Chlef, ST=Chlef, C=DZ"
          fi

      - name: Build Signed Release APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          test ${PIPESTATUS[0]} -eq 0
          ls -lh app/build/outputs/apk/release/

      - name: Verify Native & Amazon Appstore Compliance (< 50 MB, Signed v1+v2+v3, Non-Debuggable)
        run: |
          set -e
          if grep -R "WebView" app/src --include="*.kt" --include="*.xml"; then
            echo "ERROR: WebView found in app/src"
            exit 1
          fi
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / (1024*1024)}")
          echo "Release APK size: $SIZE_BYTES bytes ($SIZE_MB MiB)"
          if [ "$SIZE_BYTES" -ge 50000000 ]; then
            echo "ERROR: APK exceeds Amazon Appstore 50 MB limit ($SIZE_BYTES bytes)"
            exit 1
          fi
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK_PATH"
          BADGING=$($ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK_PATH")
          echo "$BADGING" | head -n 25
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "ERROR: APK is marked debuggable!"
            exit 1
          fi
          echo "Amazon Appstore Release APK verified successfully!"

      - name: Stage Validation APK
        if: success()
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./BECETTI-TOOLS-validation.apk
          sha256sum BECETTI-TOOLS-validation.apk > BECETTI-TOOLS-validation.apk.sha256
          ls -lh ./BECETTI-TOOLS-validation.apk*

      - name: Upload Validation APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BECETTI-TOOLS-validation
          path: |
            BECETTI-TOOLS-validation.apk
            BECETTI-TOOLS-validation.apk.sha256
          if-no-files-found: ignore
