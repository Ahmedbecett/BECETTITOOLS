name: Build BECETTI TOOLS v1.1.0 APK

on:
  push:
    branches: ["arena/ba5cdcee-becettitools", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          cache-disabled: true

      - name: Install Android SDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv /tmp/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
          if [ -d "/tmp/cmdline-tools/cmdline-tools" ]; then mv /tmp/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true; fi
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Verify existing release keystore
        run: test -s keystore/becetti-release.jks

      - name: Build Signed Release APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          test ${PIPESTATUS[0]} -eq 0
          ls -lh app/build/outputs/apk/release/

      - name: Verify Native & Amazon Appstore Compliance (< 50 MB, Signed v1+v2+v3, Non-Debuggable)
        run: |
          set -e
          if grep -R "WebView" app/src --include="*.kt" --include="*.xml"; then
            echo "ERROR: WebView found in app/src"
            exit 1
          fi
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / (1024*1024)}")
          echo "Release APK size: $SIZE_BYTES bytes ($SIZE_MB MiB)"
          if [ "$SIZE_BYTES" -ge 50000000 ]; then
            echo "ERROR: APK exceeds Amazon Appstore 50 MB limit ($SIZE_BYTES bytes)"
            exit 1
          fi
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK_PATH"
          BADGING=$($ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK_PATH")
          echo "$BADGING" | head -n 25
          echo "$BADGING" | grep -F "package: name='com.becetti.tools' versionCode='2' versionName='1.1.0'"
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "ERROR: APK is marked debuggable!"
            exit 1
          fi
          OLD_CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs BECETTI-TOOLS-v1.0.0-release.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')
          NEW_CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK_PATH" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"
          echo "Signing certificate matches the existing v1.0.0 APK."
          echo "APK package/version/signature/size checks passed."

      - name: Stage v1.1.0 APK
        if: success()
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./BECETTI-TOOLS-v1.1.0-release.apk
          sha256sum BECETTI-TOOLS-v1.1.0-release.apk > BECETTI-TOOLS-v1.1.0-release.apk.sha256
          ls -lh ./BECETTI-TOOLS-v1.1.0-release.apk*

      - name: Upload v1.1.0 APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BECETTI-TOOLS-v1.1.0-APK
          path: |
            BECETTI-TOOLS-v1.1.0-release.apk
            BECETTI-TOOLS-v1.1.0-release.apk.sha256
          if-no-files-found: error

      - name: Publish v1.1.0 APK on GitHub Releases
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/arena/ba5cdcee-becettitools' && contains(github.event.head_commit.message, 'publish APK v1.1.0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists; refusing to overwrite it."
            exit 1
          fi
          cat > /tmp/v1.1.0-release-notes.md <<'EOF'
          # BECETTI TOOLS v1.1.0

          Android APK for package `com.becetti.tools` (versionCode 2, targetSdk 34).

          This APK includes the current AdMob/UMP integration and local Wi-Fi QR-paired file transfer. CI verified the release build, APK package/version, signature validity, signing-certificate continuity with the v1.0.0 APK, non-debuggable status, and the APK size threshold.

          Device installation, two-device Wi-Fi transfer, Fire OS behavior, and Amazon Appstore submission are not certified by this CI build. `app-ads.txt` is hosted separately and remains pending a verified AdMob publisher ID and website configuration.
          EOF
          gh release create v1.1.0 \
            BECETTI-TOOLS-v1.1.0-release.apk \
            BECETTI-TOOLS-v1.1.0-release.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "BECETTI TOOLS v1.1.0 — Android APK" \
            --notes-file /tmp/v1.1.0-release-notes.md

      - name: Save Gradle failure log
        if: failure()
        run: |
          cp /tmp/gradle.log ./gradle-build-failure.log || printf 'Gradle log unavailable\n' > ./gradle-build-failure.log
          grep -E '(^e: |error:|cannot find symbol|symbol:|location:|^FAILURE:|^What went wrong:|Execution failed for task|Could not resolve|^Caused by:|^\* What went wrong:)' ./gradle-build-failure.log | tail -n 40 | while IFS= read -r line; do
            printf '::error title=Gradle build failure::%s\n' "$line"
          done

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BECETTI-TOOLS-gradle-failure-log
          path: gradle-build-failure.log
