name: Build BECETTI TOOLS v1.1.0 Release (Signed APK + AAB)

# Builds the signed release APK and AAB for v1.1.0 (versionCode 2) and uploads
# them as workflow artifacts ONLY.
# NOTE (per release policy): this workflow does NOT create GitHub Releases,
# does NOT commit to any branch, and does NOT publish to any store.

on:
  push:
    branches: ["arena/9a6aa17e-becettitools"]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION_NAME: "1.1.0"
  VERSION_CODE: "2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          if [ -d "/tmp/cmdline-tools/cmdline-tools" ]; then SRC=/tmp/cmdline-tools/cmdline-tools; else SRC=/tmp/cmdline-tools; fi
          mv $SRC/* $ANDROID_HOME/cmdline-tools/latest/
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Verify Release Keystore Exists (do not invent credentials)
        run: |
          set -e
          if [ ! -f keystore/becetti-release.jks ]; then
            echo "ERROR: keystore/becetti-release.jks is MISSING."
            echo "A signed release cannot be produced without the existing release signing credentials."
            echo "Required: the original becetti-release.jks keystore file, its store password, alias and key password"
            echo "(supplied via KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD environment variables)."
            exit 1
          fi
          keytool -list -v -keystore keystore/becetti-release.jks -storepass "${KEYSTORE_PASSWORD:-BecettiTools2026!}" | grep -E "Alias name|SHA256:|Valid from" | head -5

      - name: Build Signed Release APK + AAB
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          test ${PIPESTATUS[0]} -eq 0
          echo "--- outputs ---"
          ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      - name: Verify Release Artifacts
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          OLD_APK="BECETTI-TOOLS-v1.0.0-release.apk"
          BT=$ANDROID_HOME/build-tools/34.0.0
          {
          echo "=================================================================="
          echo "BECETTI TOOLS v${VERSION_NAME} (versionCode ${VERSION_CODE}) — RELEASE VERIFICATION"
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC') by GitHub Actions"
          echo "=================================================================="
          echo
          echo "--- 1) Package / version assertions (aapt dump badging) ---"
          BADGING=$($BT/aapt dump badging "$APK")
          echo "$BADGING" | head -n 12
          echo "$BADGING" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" || true
          echo "$BADGING" | grep -q "package: name='com.becetti.tools'" || { echo "FAIL: wrong package"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='${VERSION_CODE}'" || { echo "FAIL: wrong versionCode"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${VERSION_NAME}'" || { echo "FAIL: wrong versionName"; exit 1; }
          if echo "$BADGING" | grep -q "application-debuggable"; then echo "FAIL: debuggable"; exit 1; fi
          echo "PASS: package com.becetti.tools, versionCode ${VERSION_CODE}, versionName ${VERSION_NAME}, non-debuggable"
          echo
          echo "--- 2) APK signature verification (apksigner, v1+v2+v3) ---"
          $BT/apksigner verify --verbose --print-certs "$APK"
          CERT_NEW=$($BT/apksigner verify --print-certs "$APK" | grep "SHA-256 digest" | head -1)
          echo
          echo "--- 3) Signing-identity continuity vs published v1.0.0 binary ---"
          if [ -f "$OLD_APK" ]; then
            CERT_OLD=$($BT/apksigner verify --print-certs "$OLD_APK" | grep "SHA-256 digest" | head -1)
            echo "v1.0.0 published APK cert: $CERT_OLD"
            echo "v1.1.0 new APK cert:       $CERT_NEW"
            if [ -n "$CERT_NEW" ] && [ "$CERT_NEW" = "$CERT_OLD" ]; then
              echo "PASS: v1.1.0 is signed with the SAME signing certificate as the published v1.0.0 release (upgrade-safe)."
            else
              echo "FAIL: signing certificate differs from published v1.0.0!"
              exit 1
            fi
          else
            echo "WARN: $OLD_APK not found in repo — continuity check skipped."
          fi
          echo
          echo "--- 4) APK size check (Amazon Appstore < 50 MB guideline) ---"
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / (1024*1024)}")
          echo "Release APK size: $SIZE_BYTES bytes ($SIZE_MB MiB)"
          [ "$SIZE_BYTES" -lt 50000000 ] || { echo "FAIL: APK exceeds 50 MB"; exit 1; }
          echo "PASS: under 50 MB"
          echo
          echo "--- 5) AAB signature verification ---"
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256:|Valid" | head -4
          echo "--- apksigner on AAB (informational) ---"
          $BT/apksigner verify --verbose "$AAB" || echo "(apksigner v2 check on AAB not supported by this build-tools version; jarsigner v1 verification above is authoritative for bundles)"
          AAB_BYTES=$(stat -c%s "$AAB")
          AAB_MB=$(awk "BEGIN {printf \"%.2f\", $AAB_BYTES / (1024*1024)}")
          echo "AAB size: $AAB_BYTES bytes ($AAB_MB MiB)"
          echo
          echo "--- 6) Integrity (SHA-256) ---"
          sha256sum "$APK" "$AAB"
          if grep -R "WebView" app/src --include="*.kt" --include="*.xml"; then
            echo "FAIL: WebView found in app/src"; exit 1
          fi
          echo "PASS: no WebView usage (native UI only)"
          echo
          echo "ALL CHECKS PASSED"
          } | tee RELEASE-VERIFICATION-v${VERSION_NAME}.txt

      - name: Prepare Release Files
        if: success()
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./BECETTI-TOOLS-v1.1.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ./BECETTI-TOOLS-v1.1.0-release.aab
          sha256sum BECETTI-TOOLS-v1.1.0-release.apk > BECETTI-TOOLS-v1.1.0-release.apk.sha256
          sha256sum BECETTI-TOOLS-v1.1.0-release.aab > BECETTI-TOOLS-v1.1.0-release.aab.sha256
          ls -lh BECETTI-TOOLS-v1.1.0-release.*

      # Deliverables are committed to the SAME session working branch (never main,
      # never a GitHub Release, never a store) so they can be delivered as files.
      - name: Deliver Release Files to Session Branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BECETTI-TOOLS-v1.1.0-release.apk BECETTI-TOOLS-v1.1.0-release.apk.sha256 \
                  BECETTI-TOOLS-v1.1.0-release.aab BECETTI-TOOLS-v1.1.0-release.aab.sha256 \
                  RELEASE-VERIFICATION-v1.1.0.txt
          git commit -m "release: BECETTI TOOLS v1.1.0 (versionCode 2) signed APK + AAB + verification report [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BECETTI-TOOLS-v1.1.0-release
          path: |
            BECETTI-TOOLS-v1.1.0-release.apk
            BECETTI-TOOLS-v1.1.0-release.apk.sha256
            BECETTI-TOOLS-v1.1.0-release.aab
            BECETTI-TOOLS-v1.1.0-release.aab.sha256
            RELEASE-VERIFICATION-v1.1.0.txt
          if-no-files-found: error

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: /tmp/gradle.log
          if-no-files-found: ignore
