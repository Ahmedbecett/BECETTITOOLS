name: Build BECETTI TOOLS Native APK

on:
  push:
    branches: ["main", "arena/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
          cache-disabled: true
      - name: Install Android SDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv /tmp/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
          if [ -d "/tmp/cmdline-tools/cmdline-tools" ]; then mv /tmp/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true; fi
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - name: Build Debug APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          test ${PIPESTATUS[0]} -eq 0
          ls -lh app/build/outputs/apk/debug/
      - name: Verify native no WebView
        run: |
          if grep -R "WebView" app/src --include="*.kt" --include="*.xml"; then echo "WebView found"; exit 1; fi
          echo "Native verified"
      - name: Prepare APK
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./BECETTI-TOOLS-v1.1.0-NATIVE-debug.apk
          sha256sum ./BECETTI-TOOLS-v1.1.0-NATIVE-debug.apk > ./BECETTI-TOOLS-v1.1.0-NATIVE-debug.apk.sha256
          ls -lh ./BECETTI-TOOLS*.apk*
      - name: Commit APK
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: native APK v1.1.0 huge edition (splash+files) [skip ci]"
          file_pattern: "BECETTI-TOOLS*.apk*"
          branch: arena/e1ff9b3a-becettitools
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BECETTI-TOOLS-v1.1.0-debug-native
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
      - name: Report failure to issue
        if: failure()
        run: |
          echo "Build failed, posting log to issue"
          LOG=$(tail -c 65000 /tmp/gradle.log | head -c 60000)
          TITLE="Build failure $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${{ github.run_id }}"
          BODY="**Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          **Log tail:**
          \`\`\`
          $LOG
          \`\`\`
          "
          # Use gh to create issue
          echo "$BODY" > /tmp/issue_body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue_body.md --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

