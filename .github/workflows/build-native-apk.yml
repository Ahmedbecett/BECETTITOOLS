name: Build BECETTI TOOLS Native APK

on:
  push:
    branches: ["arena/354c3e44-becettitools", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Debug APK (Native No WebView)
        run: gradle assembleDebug --stacktrace
      - name: Build Release
        run: gradle assembleRelease --stacktrace || true
      - name: Verify native
        run: |
          echo "Verifying no WebView..."
          if grep -r "WebView" app/src --include="*.kt" --include="*.xml"; then echo "WebView found"; exit 1; fi
          echo "Native 100% Kotlin+Compose OK"
          ls -lh app/build/outputs/apk/debug/ || true
          ls -lh app/build/outputs/apk/release/ || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BECETTI-TOOLS-v1.0.0-debug-native
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
      - name: APK info
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk || true
          echo "Package com.becetti.tools v1.0.0 Native"
