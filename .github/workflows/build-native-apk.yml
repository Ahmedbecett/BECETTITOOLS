name: Build BECETTI TOOLS v1.1.0 APK

on:
  push:
    branches: ["arena/dc418d07-becettitools"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          cache-disabled: true

      - name: Install Android SDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv /tmp/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
          if [ -d "/tmp/cmdline-tools/cmdline-tools" ]; then mv /tmp/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true; fi
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Validate Arabic/French store metadata and localization resources
        run: |
          set -e
          python3 tools/check_store_metadata.py
          python3 tools/check_localization.py

      - name: Verify existing release keystore and signing identity
        run: |
          set -e
          test -s keystore/becetti-release.jks
          # The release keystore must exist and contain the established signing identity.
          # A debug keystore here would produce an APK stores reject as "not correctly signed".
          FINGERPRINT=$("$JAVA_HOME/bin/keytool" -list -v \
            -keystore keystore/becetti-release.jks \
            -storepass "${KEYSTORE_PASSWORD:-BecettiTools2026!}" \
            -alias "${KEY_ALIAS:-becetti}" | awk -F': ' '/SHA256:/ {print $2}' | tr -d ': ')
          echo "Release keystore certificate SHA-256: $FINGERPRINT"
          test "$FINGERPRINT" = "C40C4BA81A8C28465A126B11FD8FAD84CEBCF2BE163D30AE5C51BBEFF75B03B6"
          echo "Keystore holds the established release identity (same certificate as v1.0.0)."

      - name: Prepare verification tooling
        run: |
          set -e
          python3 -m venv /tmp/apkverify
          /tmp/apkverify/bin/pip install --quiet --upgrade pip
          /tmp/apkverify/bin/pip install --quiet cryptography asn1crypto
          echo "VERIFY_PYTHON=/tmp/apkverify/bin/python" >> $GITHUB_ENV
          /tmp/apkverify/bin/python -c "import cryptography, asn1crypto; print('verification environment ready')"

      - name: Build Signed Release APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          set -o pipefail
          gradle verifyReleaseApk --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          test ${PIPESTATUS[0]} -eq 0
          ls -lh app/build/outputs/apk/release/

      - name: Verify Native & Amazon Appstore Compliance (< 50 MB, Signed v1+v2+v3, Non-Debuggable)
        run: |
          set -e
          if grep -R "WebView" app/src --include="*.kt" --include="*.xml"; then
            echo "ERROR: WebView found in app/src"
            exit 1
          fi
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / (1024*1024)}")
          echo "Release APK size: $SIZE_BYTES bytes ($SIZE_MB MiB)"
          if [ "$SIZE_BYTES" -ge 50000000 ]; then
            echo "ERROR: APK exceeds Amazon Appstore 50 MB limit ($SIZE_BYTES bytes)"
            exit 1
          fi
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK_PATH"
          # Independent second opinion: JAR/v1 + v2 + v3 verification without Android tooling.
          "$VERIFY_PYTHON" tools/verify_apk_signature.py "$APK_PATH"
          BADGING=$($ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK_PATH")
          echo "$BADGING" | head -n 25
          echo "$BADGING" | grep -F "package: name='com.becetti.tools' versionCode='2' versionName='1.1.0'"
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "ERROR: APK is marked debuggable!"
            exit 1
          fi
          OLD_CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs BECETTI-TOOLS-v1.0.0-release.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')
          NEW_CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK_PATH" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"
          echo "Signing certificate matches the existing v1.0.0 APK."
          echo "APK package/version/signature/size checks passed."

      - name: Stage v1.1.0 APK (release + Softonic variant)
        if: success()
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk ./BECETTI-TOOLS-v1.1.0-release.apk
          sha256sum BECETTI-TOOLS-v1.1.0-release.apk > BECETTI-TOOLS-v1.1.0-release.apk.sha256
          # Submission APK: strips the optional dependency-info and verity-padding pairs from the
          # APK Signing Block (some strict third-party checkers trip over them) and re-verifies.
          "$VERIFY_PYTHON" tools/make_softonic_apk.py \
            BECETTI-TOOLS-v1.1.0-release.apk \
            BECETTI-TOOLS-v1.1.0-softonic.apk
          sha256sum BECETTI-TOOLS-v1.1.0-softonic.apk > BECETTI-TOOLS-v1.1.0-softonic.apk.sha256
          ls -lh ./BECETTI-TOOLS-v1.1.0-*

      - name: Commit staged APK to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f BECETTI-TOOLS-v1.1.0-release.apk BECETTI-TOOLS-v1.1.0-release.apk.sha256 \
                     BECETTI-TOOLS-v1.1.0-softonic.apk BECETTI-TOOLS-v1.1.0-softonic.apk.sha256
          git commit -m "ci: build signed release APK v1.1.0 (Softonic resubmission) [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload v1.1.0 APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BECETTI-TOOLS-v1.1.0-APK
          path: |
            BECETTI-TOOLS-v1.1.0-release.apk
            BECETTI-TOOLS-v1.1.0-release.apk.sha256
            BECETTI-TOOLS-v1.1.0-softonic.apk
            BECETTI-TOOLS-v1.1.0-softonic.apk.sha256
          if-no-files-found: error

      - name: Publish v1.1.0 APK on GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA256=$(awk '{print $1}' BECETTI-TOOLS-v1.1.0-release.apk.sha256)
          SIZE_BYTES=$(stat -c%s BECETTI-TOOLS-v1.1.0-release.apk)
          cat > /tmp/v1.1.0-release-notes.md <<EOF
          # BECETTI TOOLS v1.1.0

          Android APK for package \`com.becetti.tools\` (versionCode 2, versionName 1.1.0, targetSdk 34).

          CI verified: release build, package/version, APK signature schemes v1+v2+v3 (\`apksigner verify --verbose\`), signing-certificate continuity with v1.0.0 (same certificate), non-debuggable, size < 50 MB.

          **SHA-256:** \`${SHA256}\`
          **Size:** ${SIZE_BYTES} bytes

          After downloading, confirm the file size and SHA-256 match before uploading to any store — a truncated download invalidates the APK signature.
          EOF
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 BECETTI-TOOLS-v1.1.0-release.apk BECETTI-TOOLS-v1.1.0-release.apk.sha256 \
              BECETTI-TOOLS-v1.1.0-softonic.apk BECETTI-TOOLS-v1.1.0-softonic.apk.sha256 --clobber
            gh release edit v1.1.0 --notes-file /tmp/v1.1.0-release-notes.md
          else
            gh release create v1.1.0 \
              BECETTI-TOOLS-v1.1.0-release.apk \
              BECETTI-TOOLS-v1.1.0-release.apk.sha256 \
              BECETTI-TOOLS-v1.1.0-softonic.apk \
              BECETTI-TOOLS-v1.1.0-softonic.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "BECETTI TOOLS v1.1.0 — Android APK" \
              --notes-file /tmp/v1.1.0-release-notes.md
          fi

      - name: Save Gradle failure log
        if: failure()
        run: |
          cp /tmp/gradle.log ./gradle-build-failure.log || printf 'Gradle log unavailable\n' > ./gradle-build-failure.log
          grep -E '(^e: |error:|cannot find symbol|symbol:|location:|^FAILURE:|^What went wrong:|Execution failed for task|Could not resolve|^Caused by:|^\* What went wrong:)' ./gradle-build-failure.log | tail -n 40 | while IFS= read -r line; do
            printf '::error title=Gradle build failure::%s\n' "$line"
          done

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BECETTI-TOOLS-gradle-failure-log
          path: gradle-build-failure.log
